<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Curtains Media Visualiser</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <main class="player">
            <header class="titlebar">
                <div class="brand">
                    <div class="brand-icon">C</div>
                    <span>Curtains Media Visualiser</span>
                </div>

                <div class="window-controls">
                    <button aria-label="Minimize">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M3 11.5H13"/>
                        </svg>
                    </button>
                    <button id="maximize" aria-label="Maximize">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="2" y="3" width="12" height="9"/>
                        </svg>
                    </button>
                    <button class="close" aria-label="Close">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M4 4L12 12M12 4L4 12"/>
                        </svg>
                    </button>
                </div>
            </header>

            <nav class="toolbar">
                <div class="nav-tabs">
                    <button class="tab active">Now Playing</button>
                    <button class="tab">Library</button>
                </div>
                <div class="toolbar-right">
                    <span class="status">MEDIA PLAYER</span>
                </div>
            </nav>

            <section class="content">
                <div class="visual-area">
                    <div class="empty-state">
                        <div class="disc">
                            <div class="disc-inner"></div>
                        </div>
                        <h2>Now Playing</h2>
                        <p>Your music will appear here</p>
                    </div>
                </div>

                <div class="track-info">
                    <div class="track-art">♫</div>
                    <div class="track-details">
                        <div class="track-title" id="track-title">Nothing playing</div>
                        <div class="track-subtitle" id="track-subtitle">Open a music file to get started</div>
                    </div>
                    <button class="open-button" id="open-file">
                        <span>＋</span> Open file
                    </button>
                    <input type="file" id="file-input" accept=".mp3,audio/mpeg" hidden>
                </div>
            </section>

            <footer class="player-controls">
                <div class="timeline">
                    <span id="current-time">0:00</span>
                    <input type="range" id="seek" min="0" max="100" step="any" value="0">
                    <span id="duration">0:00</span>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <button id="back" title="Back 10 seconds">
                            <svg viewBox="0 0 24 24">
                                <path d="M11 5L2 12L11 19V5Z"/>
                                <path d="M22 5L13 12L22 19V5Z"/>
                            </svg>
                        </button>
                        <button id="play" class="play-button" title="Play">
                            <svg viewBox="0 0 24 24">
                                <path id="play-icon" d="M6 3L21 12L6 21V3Z"/>
                            </svg>
                        </button>
                        <button id="forward" title="Forward 10 seconds">
                            <svg viewBox="0 0 24 24">
                                <path d="M13 5L22 12L13 19V5Z"/>
                                <path d="M2 5L11 12L2 19V5Z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="control-group-2">
                        <button id="repeat" title="Repeat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path id="repeat-icon" d="M16 3L21 7L17 11 M21 7H7A4 4 0 0 0 3 11 M7 21L3 17L7 13 M3 17H17A4 4 0 0 0 21 13"/>
                            </svg>
                        </button>
                        <button id="fullscreen" title="Fullscreen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path id="fullscreen-icon" d="M3 9V3H9 M15 3H21V9 M21 15V21H15 M9 21H3V15"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </footer>
        </main>

        <audio id="audio"></audio>
    </body>
</html>
